services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: qraksha-backend
    ports:
      - "8000:8000"
    environment:
      - LLM_OFFLINE=1
      - DATABASE_URL=sqlite:///./qraksha.db
      - APP_ENV=production
    volumes:
      - qraksha-db-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: qraksha-frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  qraksha-db-data:
