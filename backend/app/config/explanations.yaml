# Centralized safety explanations and next steps (SPEC Section 5 and Rule 8)
# All user-facing explanations, warnings, and recommendations MUST come from this file.
# The LLM never writes or modifies safety advice shown to users.
# English text is drafted; Telugu (te) and Hindi (hi) placeholders are marked for human check.

# ---------------------------------------------------------------------------
# Guided Chatbot Explanations
# ---------------------------------------------------------------------------

chatbot_verify_payment:
  en: "Before paying, check the recipient name and UPI ID shown in your payment app. If they do not match the shop, stop and confirm with the shopkeeper."
  te: "చెల్లించే ముందు మీ చెల్లింపు యాప్‌లో చూపిన స్వీకర్త పేరు మరియు UPI IDను తనిఖీ చేయండి. అవి దుకాణం వివరాలతో సరిపోలకపోతే, ఆపి దుకాణదారునితో నిర్ధారించండి."
  hi: "भुगतान करने से पहले अपने पेमेंट ऐप में दिख रहा प्राप्तकर्ता का नाम और UPI ID जाँचें। अगर वे दुकान से मेल नहीं खाते, तो रुकें और दुकानदार से पुष्टि करें।"

chatbot_otp_safety:
  en: "Never share your UPI PIN or OTP. A UPI PIN is used to send money, not to receive it."
  te: "మీ UPI PIN లేదా OTPను ఎప్పుడూ పంచుకోవద్దు. UPI PIN డబ్బు పంపడానికి మాత్రమే, స్వీకరించడానికి కాదు."
  hi: "अपना UPI PIN या OTP कभी साझा न करें। UPI PIN पैसे भेजने के लिए होता है, पैसे पाने के लिए नहीं।"

chatbot_suspicious_message:
  en: "Do not open links, install apps, or follow urgent payment requests from unknown messages. Check suspicious message text with this app."
  te: "తెలియని సందేశాల్లోని లింక్‌లను తెరవకండి, యాప్‌లను ఇన్‌స్టాల్ చేయకండి లేదా అత్యవసర చెల్లింపు అభ్యర్థనలను పాటించకండి. అనుమానాస్పద సందేశాన్ని ఈ యాప్‌లో తనిఖీ చేయండి."
  hi: "अनजान संदेशों के लिंक न खोलें, ऐप इंस्टॉल न करें और जल्दबाज़ी में भुगतान न करें। संदिग्ध संदेश को इस ऐप में जाँचें।"

chatbot_lost_money:
  en: "If you lost money, contact your bank or payment provider and call India's cybercrime helpline at 1930 promptly. Never share your PIN or OTP."
  te: "మీ డబ్బు పోయినట్లయితే, వెంటనే మీ బ్యాంక్ లేదా చెల్లింపు సేవా సంస్థను సంప్రదించి, భారత సైబర్ క్రైమ్ హెల్ప్‌లైన్ 1930కు కాల్ చేయండి. మీ PIN లేదా OTPను పంచుకోవద్దు."
  hi: "अगर आपके पैसे चले गए हैं, तो तुरंत अपने बैंक या पेमेंट सेवा प्रदाता से संपर्क करें और भारत की साइबर अपराध हेल्पलाइन 1930 पर कॉल करें। अपना PIN या OTP साझा न करें।"

# ---------------------------------------------------------------------------
# Registry Binding Explanations
# ---------------------------------------------------------------------------

payee_not_registered_here:
  title: "Payee Not Registered Here"
  en: "The payee in this QR code differs from the verified merchant registered at this shop."
  te: "ఈ క్యూఆర్ కోడ్ లోని చెల్లింపుదారు ఈ దుకాణంలో నమోదు చేసుకున్న వ్యాపారితో సరిపోలడం లేదు."
  hi: "इस क्यूआर कोड का भुगतानकर्ता इस दुकान पर पंजीकृत व्यापारी से मेल नहीं खाता है।"
  next_steps:
    - "Do not pay"
    - "Ask the shopkeeper to confirm their registered UPI ID"
    - "If money was lost, call 1930 immediately"

matches_registry:
  title: "Verified Merchant"
  en: "QR code matches the verified merchant registered at this location."
  te: "క్యూఆర్ కోడ్ ఈ ప్రదేశంలో నమోదైన ధృవీకరించబడిన వ్యాపారితో సరిపోలుతుంది."
  hi: "क्यूआर कोड इस स्थान पर पंजीकृत सत्यापित व्यापारी से मेल खाता है।"
  next_steps:
    - "Confirm payee name matches the shop before entering your UPI PIN"

no_registry_data:
  title: "Unverified Location"
  en: "No registered merchant data available for this location or shop code."
  te: "ఈ స్థానం లేదా దుకాణం కోడ్ కోసం నమోదు చేయబడిన వ్యాపారి డేటా అందుబాటులో లేదు."
  hi: "इस स्थान या दुकान कोड के लिए कोई पंजीकृत व्यापारी डेटा उपलब्ध नहीं है।"
  next_steps:
    - "Verify the recipient name on your payment screen"
    - "Ask the shopkeeper to confirm their UPI ID before paying"

unverified_generic:
  title: "Unverified Payment"
  en: "Not enough data available to verify this payment. Proceed with caution."
  te: "[Needs Human Check] ఈ చెల్లింపును ధృవీకరించడానికి తగినంత సమాచారం లేదు. జాగ్రత్తగా ఉండండి."
  hi: "[Needs Human Check] इस भुगतान को सत्यापित करने के लिए पर्याप्त डेटा उपलब्ध नहीं है। सावधानी से आगे बढ़ें।"
  next_steps:
    - "Confirm the payee details with the recipient"
    - "Never enter your UPI PIN to receive money"

text_unverified:
  title: "No Scam Signs Detected"
  en: "No scam signs found. This is not a guarantee."
  te: "[Needs Human Check] ఎటువంటి స్కామ్ సంకేతాలు కనుగొనబడలేదు. ఇది భద్రత హామీ కాదు."
  hi: "[Needs Human Check] कोई स्कैम संकेत नहीं मिला। यह सुरक्षा की गारंटी नहीं है।"
  next_steps:
    - "Stay vigilant against unknown callers and unexpected payment requests"
    - "Never share your UPI PIN or OTP with anyone"

# ---------------------------------------------------------------------------
# Crowd Baseline Explanations
# ---------------------------------------------------------------------------

payee_changed_recently:
  title: "Payee Changed Recently"
  en: "Payment scans at this location recently showed a different payee account."
  te: "ఈ ప్రదేశంలో ఇటీవలి చెల్లింపు స్కాన్‌లు వేరే ఖాతాను చూపించాయి."
  hi: "इस स्थान पर हाल के भुगतान स्कैन ने एक अलग प्राप्तकर्ता खाता दिखाया।"
  next_steps:
    - "Ask the merchant if they changed their UPI QR recently"
    - "Confirm shop name before approving payment"

crowd_baseline_ok:
  title: "Consistent with History"
  en: "Payee is consistent with normal crowd scan baseline at this location."
  te: "చెల్లింపుదారు ఈ ప్రదేశంలో సాధారణ స్కాన్ చరిత్రతో సరిపోలుతుంది."
  hi: "भुगतानकर्ता इस स्थान पर सामान्य स्कैन इतिहास के अनुरूप है।"
  next_steps:
    - "Proceed with normal caution"

insufficient_baseline_data:
  title: "Insufficient History"
  en: "Not enough scan history at this location to verify payee pattern."
  te: "చెల్లింపు విధానాన్ని ధృవీకరించడానికి ఈ ప్రదేశంలో తగినంత స్కాన్ చరిత్ర లేదు."
  hi: "भुगतान पैटर्न को सत्यापित करने के लिए इस स्थान पर पर्याप्त स्कैन इतिहास नहीं है।"
  next_steps:
    - "Verify payee identity directly with the merchant"

# ---------------------------------------------------------------------------
# Scam Text Explanations
# ---------------------------------------------------------------------------

scam_text_danger:
  title: "Scam Message Detected"
  en: "This message contains strong indicators of a scam. Do not follow any instructions in it."
  te: "ఈ మెసేజ్ లో స్కామ్ సూచనలు ఉన్నాయి. ఇందులోని సూచనలు పాటించకండి."
  hi: "इस संदेश में स्कैम के मजबूत संकेत हैं। इसमें दिए गए किसी भी निर्देश का पालन न करें।"
  next_steps:
    - "Do not click any links or download any files"
    - "Do not share OTP, PIN, or passwords"
    - "Report to cyber crime helpline 1930"
    - "Block the sender immediately"

scam_text_caution:
  title: "Suspicious Message"
  en: "This message has some suspicious characteristics. Proceed with caution."
  te: "ఈ మెసేజ్ కొన్ని అనుమానాస్పద లక్షణాలు కలిగి ఉంది. జాగ్రత్తగా ముందుకు సాగండి."
  hi: "इस संदेश में कुछ संदिग्ध विशेषताएं हैं। सावधानी से आगे बढ़ें।"
  next_steps:
    - "Verify the sender's identity independently"
    - "Do not share personal or financial details"
    - "Contact your bank directly if it claims to be from a bank"

scam_text_ok:
  title: "No Scam Signs Found"
  en: "No scam patterns were detected in this message. This is not a guarantee of safety."
  te: "ఈ మెసేజ్ లో స్కామ్ విధానాలు కనుగొనబడలేదు. ఇది భద్రత హామీ కాదు."
  hi: "इस संदेश में कोई स्कैम पैटर्न नहीं मिला। यह सुरक्षा की गारंटी नहीं है।"
  next_steps:
    - "Stay alert for unusual requests"

# ---------------------------------------------------------------------------
# Story Link & Flagged Payee Explanations
# ---------------------------------------------------------------------------

flagged_payee_scam_link:
  title: "Flagged Scam Payee"
  en: "This payee was previously reported in a scam message. Do not send any money."
  te: "ఈ చెల్లింపుదారు గతంలో స్కామ్ సందేశంలో నివేదించబడింది. డబ్బు పంపవద్దు."
  hi: "इस भुगतानकर्ता की सूचना पहले एक स्कैम संदेश में दी गई थी। कोई पैसा न भेजें।"
  next_steps:
    - "Do not proceed with the payment"
    - "Report this payee to cyber crime helpline 1930"
    - "Alert the merchant or person who provided this QR"

story_link_ok:
  title: "No Prior Scam Reports"
  en: "This payee has no matching scam reports in our community database."
  te: "ఈ చెల్లింపుదారుపై మా కమ్యూనిటీ డేటాబేస్‌లో స్కామ్ నివేదికలు లేవు."
  hi: "हमारे समुदाय डेटाबेस में इस भुगतानकर्ता पर कोई स्कैम रिपोर्ट नहीं है।"
  next_steps:
    - "Continue verifying merchant identity before paying"

# ---------------------------------------------------------------------------
# Lookalike Handle Explanations
# ---------------------------------------------------------------------------

lookalike_brand_support:
  title: "Impersonation Risk"
  en: "This UPI address combines a recognized brand name with support keywords, a common pattern in phishing scams."
  te: "[Needs Human Check] ఈ UPI చిరునామా బ్రాండ్ పేరు మరియు సపోర్ట్ పదాన్ని మిళితం చేస్తుంది, ఇది మోసపూరితమైనది."
  hi: "[Needs Human Check] यह UPI पता ब्रांड नाम और सपोर्ट शब्द को जोड़ता है, जो फ़िशिंग का सामान्य तरीका है।"
  next_steps:
    - "Do not transfer money to this address"
    - "Official organizations do not use generic payment handles for support"
    - "Call official customer care directly using their verified website"

lookalike_suffix_typo:
  title: "Typo / Lookalike Suffix"
  en: "The bank handle suffix closely mimics a legitimate bank handle, indicating a possible fake account."
  te: "[Needs Human Check] బ్యాంక్ హ్యాండిల్ అసలు హ్యాండిల్‌ను పోలి ఉంది, ఇది నకిలీ ఖాతా కావచ్చు."
  hi: "[Needs Human Check] बैंक हैंडल असली बैंक हैंडल जैसा दिखता है, जो फ़र्ज़ी खाता हो सकता है।"
  next_steps:
    - "Verify the spelling of the bank handle suffix"
    - "Confirm with the official bank before proceeding"

unknown_handle_suffix:
  title: "Unrecognized Bank Handle"
  en: "The handle suffix is not recognized among standard NPCI-published banking providers."
  te: "[Needs Human Check] ఈ హ్యాండిల్ అధికారిక NPCI ప్రొవైడర్లలో గుర్తించబడలేదు."
  hi: "[Needs Human Check] यह हैंडल मानक NPCI बैंक प्रदाताओं में पहचाना नहीं गया है।"
  next_steps:
    - "Double-check the payment address with the recipient"
    - "Ensure the UPI app displays the verified recipient name"

lookalike_digit_swap:
  title: "Lookalike Character Swap"
  en: "This handle swaps numbers for letters in a brand name (leetspeak), a technique used to evade fraud filters."
  te: "[Needs Human Check] ఈ హ్యాండిల్‌లో అక్షరాలకు బదులుగా సంఖ్యలు ఉపయోగించబడ్డాయి."
  hi: "[Needs Human Check] इस हैंडल में अक्षरों की जगह नंबरों का इस्तेमाल किया गया है।"
  next_steps:
    - "Do not pay to lookalike addresses"
    - "Verify the recipient's authentic UPI ID"

# ---------------------------------------------------------------------------
# QR Parser Explanations
# ---------------------------------------------------------------------------

missing_payee_address:
  title: "Invalid QR Code"
  en: "This QR code does not contain a valid UPI payee address (pa parameter)."
  te: "[Needs Human Check] ఈ క్యూఆర్ కోడ్‌లో చెల్లుబాటు అయ్యే UPI చిరునామా లేదు."
  hi: "[Needs Human Check] इस क्यूआर कोड में मान्य UPI पता नहीं है।"
  next_steps:
    - "Do not scan or pay using this QR code"
    - "Ask the shopkeeper for a clean, undamaged QR code"

invalid_upi_scheme:
  title: "Not a UPI Link"
  en: "The scanned link is not a standard UPI payment URI (must begin with upi://pay)."
  te: "[Needs Human Check] స్కాన్ చేసిన లింక్ ప్రామాణిక UPI చెల్లింపు లింక్ కాదు."
  hi: "[Needs Human Check] स्कैन किया गया लिंक मानक UPI भुगतान लिंक नहीं है।"
  next_steps:
    - "Do not open non-UPI links in your browser"
    - "Only scan official UPI payment QR codes"

invalid_payment_amount:
  title: "Suspicious Payment Amount"
  en: "The QR code specifies an unusual, zero, or negative payment amount."
  te: "[Needs Human Check] క్యూఆర్ కోడ్‌లో అసాధారణమైన లేదా సున్నా మొత్తం పేర్కొనబడింది."
  hi: "[Needs Human Check] क्यूआर कोड में असामान्य या शून्य राशि निर्दिष्ट है।"
  next_steps:
    - "Enter the payment amount manually in your trusted UPI app"
    - "Confirm the amount with the merchant before authorizing"

whitespace_in_payee_address:
  title: "Malformed Payee Address"
  en: "The payee address contains invalid spaces or forbidden characters."
  te: "[Needs Human Check] చెల్లింపుదారు చిరునామాలో ఖాళీలు లేదా తప్పు అక్షరాలు ఉన్నాయి."
  hi: "[Needs Human Check] प्राप्तकर्ता पते में अमान्य स्पेस या वर्जित वर्ण हैं।"
  next_steps:
    - "Do not approve payments to malformed addresses"
    - "Re-scan or type the clean address manually"

# ---------------------------------------------------------------------------
# OCR Explanations
# ---------------------------------------------------------------------------

ocr_qr_decoded:
  title: "QR Code Read from Image"
  en: "Successfully scanned and decoded the QR code from the uploaded image."
  te: "అప్‌లోడ్ చేసిన చిత్రం నుండి క్యూఆర్ కోడ్ విజయవంతంగా డీకోడ్ చేయబడింది."
  hi: "अपलोड की गई छवि से क्यूआर कोड को सफलतापूर्वक डिकोड किया गया।"
  next_steps:
    - "Review the safety analysis of the decoded QR"

ocr_text_extracted:
  title: "Text Read from Screenshot"
  en: "Successfully extracted text from the uploaded screenshot for analysis."
  te: "విశ్లేషణ కోసం స్క్రీన్‌షాట్ నుండి వచనం విజయవంతంగా సంగ్రహించబడింది."
  hi: "विश्लेषण के लिए स्क्रीनशॉट से टेक्स्ट सफलतापूर्वक निकाला गया।"
  next_steps:
    - "Review the scam analysis of the extracted text"

ocr_low_confidence:
  title: "Image Unclear"
  en: "The uploaded image could not be read clearly. Please paste the text directly."
  te: "అప్‌లోడ్ చేసిన చిత్రం స్పష్టంగా చదవబడలేదు. దయచేసి వచనాన్ని నేరుగా అతికించండి."
  hi: "अपलोड की गई छवि को स्पष्ट रूप से नहीं पढ़ा जा सका। कृपया टेक्स्ट को सीधे पेस्ट करें।"
  next_steps:
    - "Copy the message text and paste it into the check box"

# ---------------------------------------------------------------------------
# APK Static Triage Explanations (SPEC Section 6.8)
# ---------------------------------------------------------------------------

apk_malicious_danger:
  title: "Malicious App Package Detected"
  en: "This APK file requests dangerous surveillance permissions and comes from an untrusted source. Do not install."
