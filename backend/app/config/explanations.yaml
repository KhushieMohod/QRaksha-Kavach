# Centralized safety explanations and next steps (SPEC Section 5 and Rule 8)
# All user-facing explanations, warnings, and recommendations MUST come from this file.
# The LLM never writes or modifies safety advice shown to users.

payee_not_registered_here:
  title: "Payee Not Registered Here"
  en: "The payee in this QR code differs from the verified merchant registered at this shop."
  te: "ఈ క్యూఆర్ కోడ్ లోని చెల్లింపుదారు ఈ దుకాణంలో నమోదు చేసుకున్న వ్యాపారితో సరిపోలడం లేదు."
  hi: "इस क्यूआर कोड का भुगतानकर्ता इस दुकान पर पंजीकृत व्यापारी से मेल नहीं खाता है।"
  next_steps:
    - "Do not pay"
    - "Ask the shop to confirm its UPI ID"
    - "If money was lost, call 1930"

matches_registry:
  title: "Verified Merchant"
  en: "QR code matches the verified merchant registered at this location."
  te: "క్యూఆర్ కోడ్ ఈ ప్రదేశంలో నమోదైన ధృవీకరించబడిన వ్యాపారితో సరిపోలుతుంది."
  hi: "क्यूआर कोड इस स्थान पर पंजीकृत सत्यापित व्यापारी से मेल खाता है।"
  next_steps:
    - "Confirm payee name matches the shop before entering your PIN"

no_registry_data:
  title: "Unverified Location"
  en: "No registered merchant data available for this location or shop code."
  te: "ఈ స్థానం లేదా దుకాణం కోడ్ కోసం నమోదు చేయబడిన వ్యాపారి డేటా అందుబాటులో లేదు."
  hi: "इस स्थान या दुकान कोड के लिए कोई पंजीकृत व्यापारी डेटा उपलब्ध नहीं है।"
  next_steps:
    - "Verify the recipient name on your payment screen"
    - "Ask the shopkeeper to confirm their UPI ID"

payee_changed_recently:
  title: "Payee Changed Recently"
  en: "Payment scans at this location recently showed a different payee account."
  te: "ఈ ప్రదేశంలో ఇటీవలి చెల్లింపు స్కాన్‌లు వేరే ఖాతాను చూపించాయి."
  hi: "इस स्थान पर हाल के भुगतान स्कैन ने एक अलग प्राप्तकर्ता खाता दिखाया।"
  next_steps:
    - "Ask the merchant if they changed their UPI QR recently"
    - "Confirm shop name before approving payment"

crowd_baseline_ok:
  title: "Consistent with History"
  en: "Payee is consistent with normal crowd scan baseline at this location."
  te: "చెల్లింపుదారు ఈ ప్రదేశంలో సాధారణ స్కాన్ చరిత్రతో సరిపోలుతుంది."
  hi: "भुगतानकर्ता इस स्थान पर सामान्य स्कैन इतिहास के अनुरूप है।"
  next_steps:
    - "Proceed with normal caution"

insufficient_baseline_data:
  title: "Insufficient History"
  en: "Not enough scan history at this location to verify payee pattern."
  te: "చెల్లింపు విధానాన్ని ధృవీకరించడానికి ఈ ప్రదేశంలో తగినంత స్కాన్ చరిత్ర లేదు."
  hi: "भुगतान पैटर्न को सत्यापित करने के लिए इस स्थान पर पर्याप्त स्कैन इतिहास नहीं है।"
  next_steps:
    - "Verify payee identity directly with the merchant"


scam_text_danger:
  title: "Scam Message Detected"
  en: "This message contains strong indicators of a scam. Do not follow any instructions in it."
  te: "ఈ మెసేజ్ లో స్కామ్ సూచనలు ఉన్నాయి. ఇందులోని సూచనలు పాటించకండి."
  hi: "इस संदेश में स्कैम के मजबूत संकेत हैं। इसमें दिए गए किसी भी निर्देश का पालन न करें।"
  next_steps:
    - "Do not click any links or download any files"
    - "Do not share OTP, PIN, or passwords"
    - "Report to cyber crime helpline 1930"
    - "Block the sender"

scam_text_caution:
  title: "Suspicious Message"
  en: "This message has some suspicious characteristics. Proceed with caution."
  te: "ఈ మెసేజ్ కొన్ని అనుమానాస్పద లక్షణాలు కలిగి ఉంది. జాగ్రత్తగా ముందుకు సాగండి."
  hi: "इस संदेश में कुछ संदिग्ध विशेषताएं हैं। सावधानी से आगे बढ़ें।"
  next_steps:
    - "Verify the sender's identity independently"
    - "Do not share personal or financial details"
    - "Contact your bank directly if it claims to be from a bank"

scam_text_ok:
  title: "No Scam Signs Found"
  en: "No scam patterns were detected in this message. This is not a guarantee of safety."
  te: "ఈ మెసేజ్ లో స్కామ్ విధానాలు కనుగొనబడలేదు. ఇది భద్రత హామీ కాదు."
  hi: "इस संदेश में कोई स्कैम पैटर्न नहीं मिला। यह सुरक्षा की गारंटी नहीं है।"
  next_steps:
    - "Stay alert for unusual requests"

flagged_payee_scam_link:
  title: "Flagged Scam Payee"
  en: "This payee was previously reported in a scam message. Do not send any money."
  te: "ఈ చెల్లింపుదారు గతంలో స్కామ్ సందేశంలో నివేదించబడింది. డబ్బు పంపవద్దు."
  hi: "इस भुगतानकर्ता की सूचना पहले एक स्कैम संदेश में दी गई थी। कोई पैसा न भेजें।"
  next_steps:
    - "Do not proceed with the payment"
    - "Report this payee to cyber crime helpline 1930"
    - "Alert the merchant or person who provided this QR"

story_link_ok:
  title: "No Prior Scam Reports"
  en: "This payee has no matching scam reports in our community database."
  te: "ఈ చెల్లింపుదారుపై మా కమ్యూనిటీ డేటాబేస్‌లో స్కామ్ నివేదికలు లేవు."
  hi: "हमारे समुदाय डेटाबेस में इस भुगतानकर्ता पर कोई स्कैम रिपोर्ट नहीं है।"
  next_steps:
    - "Continue verifying merchant identity before paying"

ocr_qr_decoded:
  title: "QR Code Read from Image"
  en: "Successfully scanned and decoded the QR code from the uploaded image."
  te: "అప్‌లోడ్ చేసిన చిత్రం నుండి క్యూఆర్ కోడ్ విజయవంతంగా డీకోడ్ చేయబడింది."
  hi: "अपलोड की गई छवि से क्यूआर कोड को सफलतापूर्वक डिकोड किया गया।"
  next_steps:
    - "Review the safety analysis of the decoded QR"

ocr_text_extracted:
  title: "Text Read from Screenshot"
  en: "Successfully extracted text from the uploaded screenshot for analysis."
  te: "విశ్లేషణ కోసం స్క్రీన్‌షాట్ నుండి వచనం విజయవంతంగా సంగ్రహించబడింది."
  hi: "विश्लेषण के लिए स्क्रीनशॉट से टेक्स्ट सफलतापूर्वक निकाला गया।"
  next_steps:
    - "Review the scam analysis of the extracted text"

ocr_low_confidence:
  title: "Image Unclear"
  en: "The uploaded image could not be read clearly. Please paste the text directly."
  te: "అప్‌లోడ్ చేసిన చిత్రం స్పష్టంగా చదవబడలేదు. దయచేసి వచనాన్ని నేరుగా అతికించండి."
  hi: "अपलोड की गई छवि को स्पष्ट रूप से नहीं पढ़ा जा सका। कृपया टेक्स्ट को सीधे पेस्ट करें।"
  next_steps:
    - "Copy the message text and paste it into the check box"
